<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>You’re invited – Chapra Pooje, Haldi & Mehendi</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Nunito+Sans:wght@400;600;700&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fffdf8; --b1:#fdf1ed; --b2:#fcf4dc; --b3:#eff4e8; --surface:rgba(255,255,255,.72); --field:#fffdf9;
  --ink:#4f3d33; --muted:#8f7d6e; --accent:#9d7627; --accent-ink:#fff; --line:#efe4cc; --sel:#d9b45a; --green:#6f8f5e; --pill:#e4eed9; --pill-ink:#4d6a3d;
  --shadow:0 12px 32px rgba(170,140,70,.14); color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito Sans",system-ui,sans-serif;line-height:1.6;min-height:100vh;position:relative}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(60% 40% at 8% 6%,var(--b2),transparent 70%),radial-gradient(55% 38% at 100% 30%,var(--b1),transparent 70%),radial-gradient(60% 40% at 0% 75%,var(--b3),transparent 70%),radial-gradient(50% 35% at 100% 100%,var(--b2),transparent 70%)}
main{max-width:520px;margin:0 auto;padding:0 18px 48px}
svg.defs{position:absolute;width:0;height:0}
.garland{display:block;width:100%;height:auto;transform-origin:50% 0;animation:sway 7s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-.5deg)}to{transform:rotate(.5deg)}}
@media (prefers-reduced-motion:reduce){.garland{animation:none}}
.arch{position:relative;margin-top:-4px;background:var(--surface);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-radius:240px 240px 32px 32px;border:1.5px solid var(--line);box-shadow:var(--shadow);padding:50px 24px 32px;text-align:center}
.arch::before{content:"";position:absolute;inset:8px;border:1px dashed var(--line);border-radius:232px 232px 26px 26px;pointer-events:none}
.arch .diya{width:42px;height:42px}
.from{font-family:"Cormorant Garamond",Georgia,serif;font-size:1.2rem;color:var(--muted);margin:6px 0 0}
.bride{font-family:"Cormorant Garamond",Georgia,serif;font-style:normal;font-size:2.7rem;line-height:1.2;letter-spacing:.05em;margin:6px 0 8px;font-weight:600;color:#b08a33;background:linear-gradient(135deg,#9c722a,#e6c675 50%,#9c722a);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sub{font-family:"Cormorant Garamond",Georgia,serif;font-size:1.25rem;font-weight:500;margin:0}
.when{display:inline-block;margin:18px 0 6px;padding:8px 20px;border-radius:999px;background:var(--pill);color:var(--pill-ink);font-weight:700;font-size:.95rem}
